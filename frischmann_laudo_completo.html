    /* Estilos CSS do Design Premium */
    :root {

    body {

    .container-controls,

    /* Campo de busca */
    .search-wrapper {

      max-width: 400px;
    }

    .search-input {
      width: 100%;
      padding: 10px 14px 10px 38px;
      font-size: 14px;
      font-family: inherit;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background-color: #f8fafc;
      color: var(--text-primary);
      transition: all 0.2s ease;
    }

    .search-input:focus {
      outline: none;
      border-color: var(--primary-color);
      background-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.15);

    .search-icon {

    /* Grupo de busca e controle de largura */

    .width-slider {

      width: 100px;
      height: 5px;
      border-radius: 3px;
      background: var(--border-color);
      outline: none;
      transition: background 0.2s ease;

    .width-slider::-webkit-slider-thumb {
      -webkit-appearance: none;

      height: 13px;
      border-radius: 50%;
      background: var(--primary-color);

      transition: transform 0.1s ease, background-color 0.2s ease;

      top: 0;

      width: 6px;

      user-select: none;
      z-index: 1;

    th:hover .resize-handle,
    th.resizing .resize-handle {
      opacity: 1;
    }

    th.resizing .resize-handle {
      background: linear-gradient(to right, transparent 40%, var(--primary-color) 40%, var(--primary-color) 60%, transparent 60%);
    }

    /* Impede seleção de texto durante o drag */
    body.col-resizing {
      cursor: col-resize;
      user-select: none;
    }

    body.col-resizing * {
      pointer-events: none;
    }

    body.col-resizing .resize-handle {
      pointer-events: all;

<body>

  <script type="text/babel">

        ],
        reason: "Em geral, esses grupos vieram dentro da referência ou sem alteração significativa no laudo atual.",
        attention: "Não parecem ser os principais pontos de preocupação neste momento, considerando os resultados apresentados.",
        recommendation: "Manter acompanhamento de rotina e interpretar junto com sintomas, histórico clínico e avaliação médica.",

    ];

    function SearchIcon() {
      return (
        <svg className="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      );
    }

    function SortIcon({ direction, active }) {
      if (!active) return <span className="sort-icon">⇅</span>;
      return <span className="sort-icon">{direction === 'asc' ? '▲' : '▼'}</span>;
    }

    const severityLabels = {
      critico: "Crítica",
      alto: "Alta",
      moderado: "Moderada",
      baixo: "Baixa",
      normal: "Normal"
    };

    // Componente externo e estável — definido fora de ReportApp para que o React nunca o
    // considere um tipo diferente entre re-renders (corrige React error #62)
    function ResizableHeader({ colKey, className, label, sortKey, sortConfig, colWidths, thRefs, onSort, onResizeStart }) {
      const isActive = sortConfig.key === sortKey;
      const width = colWidths[colKey];
      return (
        <th
          ref={el => { thRefs.current[colKey] = el; }}
          onClick={() => onSort(sortKey)}
          className={`${className} ${isActive ? 'active' : ''}`}
          style={width ? { width: width + 'px', minWidth: '60px' } : undefined}
        >
          <div className="th-content">
            {label} <SortIcon active={isActive} direction={sortConfig.direction} />
          </div>
          <div
            className="resize-handle"
            onMouseDown={(e) => onResizeStart(colKey, e)}
            onClick={(e) => e.stopPropagation()}
            title="Arraste para redimensionar"
            aria-label={`Redimensionar coluna ${label}`}
          />
        </th>
      );
    }

    function ReportApp() {
      const [searchTerm, setSearchTerm] = useState('');
      const [selectedSeverity, setSelectedSeverity] = useState('all');
      const [sortConfig, setSortConfig] = useState({ key: 'id', direction: 'asc' });
      const [containerWidth, setContainerWidth] = useState(95);

      // Larguras iniciais das colunas em pixels (null = usa CSS)
      const INITIAL_WIDTHS = { id: null, name: null, interpretation: null, severity: null, reason: null, attention: null, recommendation: null };
      const [colWidths, setColWidths] = useState(INITIAL_WIDTHS);

      // Ref para dados de drag — não causa re-render durante o arrasto (React best practices: Section 5)
      const dragRef = useRef(null);
      const thRefs = useRef({});

      // Handler de início do resize — useCallback para referência estável
      const handleResizeStart = useCallback((colKey, e) => {
        e.preventDefault();
        e.stopPropagation();

        const th = thRefs.current[colKey];
        if (!th) return;

        const startX = e.clientX;
        const startWidth = th.getBoundingClientRect().width;

        dragRef.current = { colKey, startX, startWidth };
        document.body.classList.add('col-resizing');
        th.classList.add('resizing');

        const onMouseMove = (moveEvent) => {
          const { startX, startWidth, colKey } = dragRef.current;
          const delta = moveEvent.clientX - startX;
          const newWidth = Math.max(60, startWidth + delta);
          // Atualiza o DOM diretamente durante o drag para máxima fluidez (sem re-render)
          thRefs.current[colKey].style.width = newWidth + 'px';
        };

        const onMouseUp = (upEvent) => {
          const { startX, startWidth, colKey } = dragRef.current;
          const delta = upEvent.clientX - startX;
          const newWidth = Math.max(60, startWidth + delta);

          // Atualiza o estado React apenas uma vez, ao soltar
          setColWidths(prev => ({ ...prev, [colKey]: newWidth }));

          document.body.classList.remove('col-resizing');
          if (thRefs.current[colKey]) {
            thRefs.current[colKey].classList.remove('resizing');
          }
          dragRef.current = null;

          document.removeEventListener('mousemove', onMouseMove);
          document.removeEventListener('mouseup', onMouseUp);
        };

        document.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mouseup', onMouseUp);
      }, []);

      // Contagem para os botões de filtros rápidos
      const counts = useMemo(() => {
        const countsObj = { all: initialExams.length };
        initialExams.forEach(item => {
          countsObj[item.severity] = (countsObj[item.severity] || 0) + 1;
        });
        return countsObj;
      }, []);

      // Lógica de filtragem e busca (usando useMemo para performance)
      const filteredExams = useMemo(() => {
        return initialExams.filter(item => {
          const matchesFilter = selectedSeverity === 'all' || item.severity === selectedSeverity;

          const searchLower = searchTerm.toLowerCase();
          const matchesSearch =
            item.name.toLowerCase().includes(searchLower) ||
            item.reason.toLowerCase().includes(searchLower) ||
            item.attention.toLowerCase().includes(searchLower) ||
            item.recommendation.toLowerCase().includes(searchLower) ||
            item.interpretation.some(badge => badge.text.toLowerCase().includes(searchLower));

          return matchesFilter && matchesSearch;
        });
      }, [searchTerm, selectedSeverity]);

      // Lógica de ordenação (usando useMemo para performance)
      const sortedExams = useMemo(() => {
        if (!sortConfig.key) return filteredExams;

        return [...filteredExams].sort((a, b) => {
          let valA, valB;

          if (sortConfig.key === 'id') {
            valA = a.id;
            valB = b.id;
          } else if (sortConfig.key === 'name') {
            valA = a.name;
            valB = b.name;
          } else if (sortConfig.key === 'reason') {
            valA = a.reason;
            valB = b.reason;
          } else if (sortConfig.key === 'attention') {
            valA = a.attention;
            valB = b.attention;
          } else if (sortConfig.key === 'recommendation') {
            valA = a.recommendation;
            valB = b.recommendation;
          } else if (sortConfig.key === 'interpretation') {
            valA = a.interpretation.map(badge => badge.text).join(' ');
            valB = b.interpretation.map(badge => badge.text).join(' ');
          } else if (sortConfig.key === 'severity') {
            const severityPriority = { critico: 5, alto: 4, moderado: 3, baixo: 2, normal: 1 };
            valA = severityPriority[a.severity] || 0;
            valB = severityPriority[b.severity] || 0;
          }

          if (valA < valB) return sortConfig.direction === 'asc' ? -1 : 1;
          if (valA > valB) return sortConfig.direction === 'asc' ? 1 : -1;
          return 0;
        });
      }, [filteredExams, sortConfig]);

      const handleSort = (key) => {
        let direction = 'asc';
        if (sortConfig.key === key && sortConfig.direction === 'asc') {
          direction = 'desc';
        }
        setSortConfig({ key, direction });
      };

      const handleFilterClick = (severity) => {
        setSelectedSeverity(severity);
      };

      return (
        <React.Fragment>
          <div className="container-controls">
            <header>
              <h1>Laudo Frischmann - Resumo de Atenção</h1>
              <p className="subtitle">Visualização estruturada e interativa dos seus exames laboratoriais.</p>
            </header>

            {/* Área de Filtros e Busca */}
            <div className="controls-card">
              <div className="search-wrapper-group">
                <div className="search-wrapper">
                  <SearchIcon />
                  <input
                    type="text"
                    className="search-input"
                    placeholder="Buscar exames, motivos ou recomendações..."
                    value={searchTerm}
                    onChange={(e) => setSearchTerm(e.target.value)}
                    aria-label="Buscar exames"
                  />
                </div>

                <div className="width-control-wrapper">
                  <span>Tabela: <strong>{containerWidth}%</strong></span>
                  <input
                    type="range"
                    className="width-slider"
                    min="50"
                    max="100"
                    value={containerWidth}
                    onChange={(e) => setContainerWidth(Number(e.target.value))}
                    title="Ajustar largura da tabela"
                    aria-label="Ajustar largura da tabela"
                  />
                </div>
              </div>

              <div className="filters-wrapper">
                <button
                  className={`filter-btn filter-btn-todos ${selectedSeverity === 'all' ? 'active' : ''}`}
                  onClick={() => handleFilterClick('all')}
                >
                  TODOS <span className="filter-count">{counts.all}</span>
                </button>
                <button
                  className={`filter-btn filter-btn-critico ${selectedSeverity === 'critico' ? 'active' : ''}`}
                  onClick={() => handleFilterClick('critico')}
                >
                  CRÍTICA <span className="filter-count">{counts.critico || 0}</span>
                </button>
                <button
                  className={`filter-btn filter-btn-alto ${selectedSeverity === 'alto' ? 'active' : ''}`}
                  onClick={() => handleFilterClick('alto')}
                >
                  ALTA <span className="filter-count">{counts.alto || 0}</span>
                </button>
                <button
                  className={`filter-btn filter-btn-moderado ${selectedSeverity === 'moderado' ? 'active' : ''}`}
                  onClick={() => handleFilterClick('moderado')}
                >
                  MODERADA <span className="filter-count">{counts.moderado || 0}</span>
                </button>
                <button
                  className={`filter-btn filter-btn-baixo ${selectedSeverity === 'baixo' ? 'active' : ''}`}
                  onClick={() => handleFilterClick('baixo')}
                >
                  BAIXA <span className="filter-count">{counts.baixo || 0}</span>
                </button>
                <button
                  className={`filter-btn filter-btn-normal ${selectedSeverity === 'normal' ? 'active' : ''}`}
                  onClick={() => handleFilterClick('normal')}
                >
                  NORMAL <span className="filter-count">{counts.normal || 0}</span>
                </button>
              </div>
            </div>
          </div>

          <div className="container-table" style={{ width: `${containerWidth}%` }}>
            {/* Tabela de Exames */}
            <div className="table-container">
              <div className="table-responsive">
                <table>
                  <thead>
                    <tr>
                      <ResizableHeader colKey="id" className="col-id" label="#" sortKey="id" sortConfig={sortConfig} colWidths={colWidths} thRefs={thRefs} onSort={handleSort} onResizeStart={handleResizeStart} />
                      <ResizableHeader colKey="name" className="col-exames" label="Exames" sortKey="name" sortConfig={sortConfig} colWidths={colWidths} thRefs={thRefs} onSort={handleSort} onResizeStart={handleResizeStart} />
                      <ResizableHeader colKey="interpretation" className="col-interpretacao" label="Interpretação" sortKey="interpretation" sortConfig={sortConfig} colWidths={colWidths} thRefs={thRefs} onSort={handleSort} onResizeStart={handleResizeStart} />
                      <ResizableHeader colKey="severity" className="col-severidade" label="Severidade" sortKey="severity" sortConfig={sortConfig} colWidths={colWidths} thRefs={thRefs} onSort={handleSort} onResizeStart={handleResizeStart} />
                      <ResizableHeader colKey="reason" className="col-motivo" label="Motivo" sortKey="reason" sortConfig={sortConfig} colWidths={colWidths} thRefs={thRefs} onSort={handleSort} onResizeStart={handleResizeStart} />
                      <ResizableHeader colKey="attention" className="col-atencao" label="Ponto de Atenção" sortKey="attention" sortConfig={sortConfig} colWidths={colWidths} thRefs={thRefs} onSort={handleSort} onResizeStart={handleResizeStart} />
                      <ResizableHeader colKey="recommendation" className="col-recomendacao" label="Possível Recomendação" sortKey="recommendation" sortConfig={sortConfig} colWidths={colWidths} thRefs={thRefs} onSort={handleSort} onResizeStart={handleResizeStart} />
                    </tr>
                  </thead>
                  <tbody>
                    {sortedExams.length > 0 ? (
                      sortedExams.map((item) => (
                        <tr key={item.id} className={`row-hover row-${item.severity}`}>
                          <td>{item.id}</td>
                          <td>
                            <div className="badge-list">
                              {item.name.split(' + ').map((part, idx) => {
                                const partSeverity = item.interpretation[idx] ? item.interpretation[idx].severity : item.severity;
                                return (
                                  <span key={idx} className={`badge badge-exam badge-${partSeverity}`}>
                                    {part}
                                  </span>
                                );
                              })}
                            </div>
                          </td>
                          <td>
                            <div className="badge-list">
                              {item.interpretation.map((badge, idx) => (
                                <span key={idx} className={`badge badge-${badge.severity}`}>
                                  {badge.text}
                                </span>
                              ))}
                            </div>
                          </td>
                          <td>
                            <span className={`badge badge-${item.severity}`}>
                              {severityLabels[item.severity]}
                            </span>
                          </td>
                          <td>{item.reason}</td>
                          <td>{item.attention}</td>
                          <td>{item.recommendation}</td>
                        </tr>
                      ))
                    ) : (
                      <tr>
                        <td colSpan="7" className="no-results">
                          Nenhum exame encontrado correspondente aos filtros aplicados.
                        </td>
                      </tr>
                    )}
                  </tbody>
                </table>
              </div>
            </div>
          </div>

          <div className="container-legend" style={{ width: `${containerWidth}%` }}>
            {/* Legenda */}
            <div className="legend-card">
              <div className="legend-title">Legenda de Cores de Atenção</div>
              <div className="legend-list">
                <div className="legend-item">
                  <div className="legend-indicator indicator-critico"></div>
                  <span>Crítica (Alteração clínica mais relevante)</span>
                </div>
                <div className="legend-item">
                  <div className="legend-indicator indicator-alto"></div>
                  <span>Alta (Alteração metabólica importante)</span>
                </div>
                <div className="legend-item">
                  <div className="legend-indicator indicator-moderado"></div>
                  <span>Moderada (Atenção moderada ou limítrofe)</span>
                </div>
                <div className="legend-item">
                  <div className="legend-indicator indicator-baixo"></div>
                  <span>Baixa (Atenção baseada em sintomas)</span>
                </div>
                <div className="legend-item">
                  <div className="legend-indicator indicator-normal"></div>
                  <span>Normal (Sem alterações clínicas relevantes)</span>
                </div>
              </div>
            </div>
          </div>
        </React.Fragment>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ReportApp />);
  </script>

</body>

</html>
