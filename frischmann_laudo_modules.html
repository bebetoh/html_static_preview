  <style>

    /* Campo de busca */
    .search-wrapper {

    }

    .search-input {

      padding: 10px 14px 10px 38px;
      font-size: 14px;
      font-family: inherit;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background-color: #f8fafc;
      color: var(--text-primary);
      transition: all 0.2s ease;
    }

    .search-input:focus {
      outline: none;
      border-color: var(--primary-color);
      background-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.15);
    }

    .search-icon {
      position: absolute;

    }

    /* Filtros rápidos */

      display: flex;

    }

    .filter-btn {

<body>

  <div id="root"></div>

  <!-- Código React escrito com HTM, executado de forma modular nativa, sem necessidade de transpilação -->
  <script type="module">
    import React, { useState, useMemo, useCallback, useRef } from 'react';
    import ReactDOM from 'react-dom';
    import htm from 'htm';

    // Cria a vinculação do htm ao React.createElement
    const html = htm.bind(React.createElement);

    const initialExams = [
      {
        id: 1,
        name: "Glicose 126 mg/dL + HbA1c 6,3%",
        interpretation: [
          { text: "Alterada", severity: "critico" },

        ],
        reason: "Sugere alteração glicêmica relevante. Pode indicar pré-diabetes ou diabetes inicial, dependendo da confirmação médica.",
        attention: "Glicose em jejum de 126 mg/dL fica no limite usado para diagnóstico de diabetes, mas precisa confirmação. HbA1c de 6,3% fica na faixa de risco aumentado para diabetes/pré-diabetes.",
        recommendation: "Conversar com o médico sobre repetir glicemia de jejum, repetir HbA1c, avaliar curva glicêmica, revisar alimentação, peso, atividade física e risco metabólico geral.",
        severity: "critico"
      },
      {
        id: 2,
        name: "TGO 63 U/L + TGP 126 U/L",
        interpretation: [
          { text: "Elevada", severity: "alto" },
          { text: "Elevada importante", severity: "critico" }
        ],
        reason: "Enzimas hepáticas elevadas, principalmente a TGP, que está bem acima da referência.",
        attention: "Pode ter relação com fígado gorduroso, álcool, medicamentos, suplementos, hepatites, exercício intenso recente ou outras causas hepáticas e musculares. Não fecha causa sozinho.",
        recommendation: "Perguntar sobre repetir TGO/TGP e pedir GGT, fosfatase alcalina, bilirrubinas, CK, sorologias para hepatites se indicado e ultrassom de abdome/fígado.",
        severity: "critico"
      },
      {
        id: 3,
        name: "Colesterol total 212 mg/dL + LDL 141 mg/dL + não-HDL 169 mg/dL",
        interpretation: [
          { text: "Alto", severity: "alto" },
          { text: "Elevado", severity: "alto" },
          { text: "Elevado", severity: "alto" }
        ],
        reason: "Perfil lipídico acima das metas ideais, principalmente LDL e não-HDL.",
        attention: "O LDL e o não-HDL precisam ser interpretados conforme o risco cardiovascular global: idade, pressão, glicose, tabagismo, histórico familiar, peso e outros fatores.",
        recommendation: "Pedir ao médico cálculo de risco cardiovascular, definição da meta de LDL e orientação sobre dieta, atividade física, perda de peso se aplicável e necessidade ou não de medicação.",
        severity: "alto"
      },
      {
        id: 4,
        name: "eGFR 81 mL/min/1,73m²",
        interpretation: [
          { text: "Levemente reduzido", severity: "moderado" }
        ],
        reason: "Leve redução da taxa estimada de filtração glomerular, com creatinina dentro da referência.",
        attention: "Abaixo da referência do laboratório, mas isoladamente não fecha doença renal. Vale avaliar junto com pressão arterial e exame de urina.",
        recommendation: "Conversar sobre urina tipo 1, relação albumina/creatinina urinária, repetição de creatinina/eGFR e controle da pressão arterial.",
        severity: "moderado"
      },
      {
        id: 5,
        name: "Vitamina D 23 ng/mL",
        interpretation: [
          { text: "Limítrofe", severity: "moderado" }
        ],
        reason: "Valor aceitável para adulto saudável abaixo de 60 anos, mas fica baixo se houver grupo de risco.",
        attention: "Aceitável para adulto saudável abaixo de 60 anos, mas baixa se houver grupo de risco, como pouca exposição solar, obesidade, doença renal, osteopenia, osteoporose, quedas, fraturas ou uso de medicamentos que interferem na vitamina D.",
        recommendation: "Perguntar se há necessidade de suplementação, ajuste de exposição solar segura e reavaliação em exame futuro.",
        severity: "moderado"
      },
      {
        id: 6,
        name: "Testosterona total 281,2 ng/dL",
        interpretation: [
          { text: "Normal baixa", severity: "baixo" }
        ],
        reason: "Está dentro da referência do laboratório, mas no terço inferior para homem adulto.",
        attention: "Dentro da referência, mas no terço inferior para homem adulto. Sozinha não indica TRT. Ganha importância se houver sintomas como baixa libido, fadiga persistente, piora de ereção, perda de massa muscular, sonolência ou queda de desempenho.",
        recommendation: "Se houver sintomas, perguntar sobre repetir testosterona pela manhã, em jejum, junto com LH, FSH, prolactina, SHBG, albumina, testosterona livre calculada e PSA total.",
        severity: "baixo"
      },
      {
        id: 7,
        name: "Hemograma, plaquetas, vitamina B12 e tireoide",
        interpretation: [
          { text: "Normal ou sem alteração relevante", severity: "normal" }
        ],
        reason: "Em geral, esses grupos vieram dentro da referência ou sem alteração significativa no laudo atual.",
        attention: "Não parecem ser os principais pontos de preocupação neste momento, considerando os resultados apresentados.",
        recommendation: "Manter acompanhamento de rotina e interpretar junto com sintomas, histórico clínico e avaliação médica.",
        severity: "normal"
      }
    ];

    function SearchIcon() {
      return html`
        <svg className="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      `;
    }

    function SortIcon({ direction, active }) {
      if (!active) return html`<span className="sort-icon">⇅</span>`;
      return html`<span className="sort-icon">${direction === 'asc' ? '▲' : '▼'}</span>`;
    }

    const severityLabels = {
      critico: "Crítico",
      alto: "Alto",
      moderado: "Moderado",
      baixo: "Baixo",
      normal: "Normal"
    };

    function ReportApp() {
      const [searchTerm, setSearchTerm] = useState('');
      const [selectedSeverity, setSelectedSeverity] = useState('all');
      const [sortConfig, setSortConfig] = useState({ key: 'id', direction: 'asc' });

      // Larguras iniciais das colunas em pixels (null = usa CSS)
      const INITIAL_WIDTHS = { id: null, name: null, interpretation: null, severity: null, reason: null, attention: null, recommendation: null };
      const [colWidths, setColWidths] = useState(INITIAL_WIDTHS);

      // Ref para dados de drag — não causa re-render durante o arrasto
      const dragRef = useRef(null);
      const thRefs = useRef({});

      // Handler de início do resize — useCallback para referência estável
      const handleResizeStart = useCallback((colKey, e) => {
        e.preventDefault();
        e.stopPropagation();

        const th = thRefs.current[colKey];
        if (!th) return;

        const startX = e.clientX;
        const startWidth = th.getBoundingClientRect().width;

        dragRef.current = { colKey, startX, startWidth };
        document.body.classList.add('col-resizing');
        th.classList.add('resizing');

        const onMouseMove = (moveEvent) => {
          const { startX, startWidth, colKey } = dragRef.current;
          const delta = moveEvent.clientX - startX;
          const newWidth = Math.max(60, startWidth + delta);
          thRefs.current[colKey].style.width = newWidth + 'px';
        };

        const onMouseUp = (upEvent) => {
          const { startX, startWidth, colKey } = dragRef.current;
          const delta = upEvent.clientX - startX;
          const newWidth = Math.max(60, startWidth + delta);

          setColWidths(prev => ({ ...prev, [colKey]: newWidth }));

          document.body.classList.remove('col-resizing');
          if (thRefs.current[colKey]) {
            thRefs.current[colKey].classList.remove('resizing');
          }
          dragRef.current = null;

          document.removeEventListener('mousemove', onMouseMove);
          document.removeEventListener('mouseup', onMouseUp);
        };

        document.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mouseup', onMouseUp);
      }, []);

      // Função de header redimensionável para htm
      const ResizableHeader = ({ colKey, className, label, sortKey }) => {
        const isActive = sortConfig.key === sortKey;
        const width = colWidths[colKey];
        return html`
          <th
            ref=${el => { thRefs.current[colKey] = el; }}
            onClick=${() => handleSort(sortKey)}
            className=${`${className} ${isActive ? 'active' : ''}`}
            style=${width ? `width:${width}px;min-width:60px` : ''}
          >
            <div className="th-content">
              ${label} <${SortIcon} active=${isActive} direction=${sortConfig.direction} />
            </div>
            <div
              className="resize-handle"
              onMouseDown=${(e) => handleResizeStart(colKey, e)}
              onClick=${(e) => e.stopPropagation()}
              title="Arraste para redimensionar"
            />
          </th>
        `;
      };

      // Contagem para os botões de filtros rápidos
      const counts = useMemo(() => {
        const countsObj = { all: initialExams.length };
        initialExams.forEach(item => {
          countsObj[item.severity] = (countsObj[item.severity] || 0) + 1;
        });
        return countsObj;
      }, []);

      // Lógica de filtragem e busca (usando useMemo para performance)
      const filteredExams = useMemo(() => {
        return initialExams.filter(item => {
          const matchesFilter = selectedSeverity === 'all' || item.severity === selectedSeverity;
          
          const searchLower = searchTerm.toLowerCase();
          const matchesSearch = 
            item.name.toLowerCase().includes(searchLower) ||
            item.reason.toLowerCase().includes(searchLower) ||
            item.attention.toLowerCase().includes(searchLower) ||
            item.recommendation.toLowerCase().includes(searchLower) ||
            item.interpretation.some(badge => badge.text.toLowerCase().includes(searchLower));

          return matchesFilter && matchesSearch;
        });
      }, [searchTerm, selectedSeverity]);

      // Lógica de ordenação (usando useMemo para performance)
      const sortedExams = useMemo(() => {
        if (!sortConfig.key) return filteredExams;

        return [...filteredExams].sort((a, b) => {
          let valA, valB;
          
          if (sortConfig.key === 'id') {
            valA = a.id;
            valB = b.id;
          } else if (sortConfig.key === 'name') {
            valA = a.name;
            valB = b.name;
          } else if (sortConfig.key === 'reason') {
            valA = a.reason;
            valB = b.reason;
          } else if (sortConfig.key === 'attention') {
            valA = a.attention;
            valB = b.attention;
          } else if (sortConfig.key === 'recommendation') {
            valA = a.recommendation;
            valB = b.recommendation;
          } else if (sortConfig.key === 'interpretation') {
            valA = a.interpretation.map(badge => badge.text).join(' ');
            valB = b.interpretation.map(badge => badge.text).join(' ');
          } else if (sortConfig.key === 'severity') {
            const severityPriority = { critico: 5, alto: 4, moderado: 3, baixo: 2, normal: 1 };
            valA = severityPriority[a.severity] || 0;
            valB = severityPriority[b.severity] || 0;
          }

          if (valA < valB) return sortConfig.direction === 'asc' ? -1 : 1;
          if (valA > valB) return sortConfig.direction === 'asc' ? 1 : -1;
          return 0;
        });
      }, [filteredExams, sortConfig]);

      const handleSort = (key) => {
        let direction = 'asc';
        if (sortConfig.key === key && sortConfig.direction === 'asc') {
          direction = 'desc';
        }
        setSortConfig({ key, direction });
      };

      const handleFilterClick = (severity) => {
        setSelectedSeverity(severity);
      };

      return html`
        <div className="container">
          <header>
            <h1>Laudo Frischmann - Resumo de Atenção (Modules)</h1>
            <p className="subtitle">Visualização estruturada e interativa dos seus exames laboratoriais via ES Modules.</p>
          </header>

          <div className="controls-card">
            <div className="search-wrapper">
              <${SearchIcon} />
              <input
                type="text"
                className="search-input"
                placeholder="Buscar exames, motivos ou recomendações..."
                value=${searchTerm}
                onInput=${(e) => setSearchTerm(e.target.value)}
                aria-label="Buscar exames"
              />
            </div>

            <div className="filters-wrapper">
              <button 
                className=${`filter-btn filter-btn-todos ${selectedSeverity === 'all' ? 'active' : ''}`}
                onClick=${() => handleFilterClick('all')}
              >
                TODOS <span className="filter-count">${counts.all}</span>
              </button>
              <button 
                className=${`filter-btn filter-btn-critico ${selectedSeverity === 'critico' ? 'active' : ''}`}
                onClick=${() => handleFilterClick('critico')}
              >
                CRÍTICO <span className="filter-count">${counts.critico || 0}</span>
              </button>
              <button 
                className=${`filter-btn filter-btn-alto ${selectedSeverity === 'alto' ? 'active' : ''}`}
                onClick=${() => handleFilterClick('alto')}
              >
                ALTO <span className="filter-count">${counts.alto || 0}</span>
              </button>
              <button 
                className=${`filter-btn filter-btn-moderado ${selectedSeverity === 'moderado' ? 'active' : ''}`}
                onClick=${() => handleFilterClick('moderado')}
              >
                MODERADO <span className="filter-count">${counts.moderado || 0}</span>
              </button>
              <button 
                className=${`filter-btn filter-btn-baixo ${selectedSeverity === 'baixo' ? 'active' : ''}`}
                onClick=${() => handleFilterClick('baixo')}
              >
                BAIXO <span className="filter-count">${counts.baixo || 0}</span>
              </button>
              <button 
                className=${`filter-btn filter-btn-normal ${selectedSeverity === 'normal' ? 'active' : ''}`}
                onClick=${() => handleFilterClick('normal')}
              >
                NORMAL <span className="filter-count">${counts.normal || 0}</span>
              </button>
            </div>
          </div>

          <div className="table-container">
            <div className="table-responsive">
              <table>
                <thead>
                  <tr>
                    <${ResizableHeader} colKey="id"             className="col-id"           label="#"                    sortKey="id" />
                    <${ResizableHeader} colKey="name"           className="col-exames"        label="Exames"               sortKey="name" />
                    <${ResizableHeader} colKey="interpretation" className="col-interpretacao" label="Interpretação"         sortKey="interpretation" />
                    <${ResizableHeader} colKey="severity"       className="col-severidade"    label="Severidade"           sortKey="severity" />
                    <${ResizableHeader} colKey="reason"         className="col-motivo"        label="Motivo"               sortKey="reason" />
                    <${ResizableHeader} colKey="attention"      className="col-atencao"       label="Ponto de Atenção"     sortKey="attention" />
                    <${ResizableHeader} colKey="recommendation" className="col-recomendacao"  label="Possível Recomendação" sortKey="recommendation" />
                  </tr>
                </thead>
                <tbody>
                  ${sortedExams.length > 0 ? (
                    sortedExams.map((item) => html`
                      <tr key=${item.id} className=${`row-hover row-${item.severity}`}>
                        <td>${item.id}</td>
                        <td className="exam-name">${item.name}</td>
                        <td>
                          <div className="badge-list">
                            ${item.interpretation.map((badge, idx) => html`
                              ${idx > 0 ? html`<span className="mais">+</span>` : null}
                              <span key=${idx} className=${`badge badge-${badge.severity}`}>
                                ${badge.text}
                              </span>
                            `)}
                          </div>
                        </td>
                        <td>
                          <span className=${`badge badge-${item.severity}`}>
                            ${severityLabels[item.severity]}
                          </span>
                        </td>
                        <td>${item.reason}</td>
                        <td>${item.attention}</td>
                        <td>${item.recommendation}</td>
                      </tr>
                    `)
                  ) : (
                    html`
                      <tr>
                        <td colSpan="7" className="no-results">
                          Nenhum exame encontrado correspondente aos filtros aplicados.
                        </td>
                      </tr>
                    `
                  )}
                </tbody>
              </table>
            </div>
          </div>

          <div className="legend-card">
            <div className="legend-title">Legenda de Cores de Atenção</div>
            <div className="legend-list">
              <div className="legend-item">
                <div className="legend-indicator indicator-critico"></div>
                <span>Crítico (Alteração clínica mais relevante)</span>
              </div>
              <div className="legend-item">
                <div className="legend-indicator indicator-alto"></div>
                <span>Alto (Alteração metabólica importante)</span>
              </div>
              <div className="legend-item">
                <div className="legend-indicator indicator-moderado"></div>
                <span>Moderado (Atenção moderada ou limítrofe)</span>
              </div>
              <div className="legend-item">
                <div className="legend-indicator indicator-baixo"></div>
                <span>Baixo (Atenção baseada em sintomas)</span>
              </div>
              <div className="legend-item">
                <div className="legend-indicator indicator-normal"></div>
                <span>Normal (Sem alterações clínicas relevantes)</span>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(html`<${ReportApp} />`);
  </script>

</body>
</html>
